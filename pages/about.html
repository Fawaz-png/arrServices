<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Professional event security services ensuring safety and peace of mind for all your events." />
    <meta name="keywords"
        content="event security, security services, crowd management, VIP protection, risk assessment" />
    <meta name="author" content="Your Company Name" />
    <title>Arr Services - Event Security Company</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        .collage-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
        }

        .image-collage {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 5px;
        }

        .image-collage img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .centered-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
        }

        .centered-text h1 {
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.6);
            margin: 0;
        }

        @media (max-width: 768px) {
            .centered-text h1 {
                font-size: 2em;
            }
        }

        @media (max-width: 480px) {
            .centered-text h1 {
                font-size: 1.5em;
            }

            .image-collage {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="../assets/images/logo.svg" alt="ARR Services Logo" class="logo" loading="lazy" />
        </div>
        <nav class="nav-links" role="navigation" aria-label="Main Navigation">
            <a href="../index.html">Home</a>
            <a href="#about-us" class="active">About Us</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#testimonials">Testimonials</a>
            <a href="#contact">Contact</a>
        </nav>
        <button class="cta desktop-only" aria-label="Get a Free Quote">
            Get a Free Quote
        </button>
        <button class="hamburger-menu" id="hamburger-menu" aria-label="Open menu" aria-expanded="false"
            aria-controls="mobile-menu">
            <i class="fa fa-bars" aria-hidden="true"></i>
        </button>
    </header>

    <div class="mobile-menu" id="mobile-menu" aria-hidden="true">
        <button class="close-btn" id="close-btn" aria-label="Close menu">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
        <nav role="navigation" aria-label="Mobile Navigation">
            <a href="#">Home</a>
            <a href="#about-us">About Us</a>
            <a href="#services">Services</a>
            <a href="#portfolio">Portfolio</a>
            <a href="#testimonials">Testimonials</a>
            <a href="#contact">Contact</a>
            <button class="cta">Get a Free Quote</button>
        </nav>
    </div>

    <div class="collage-container">
        <div class="image-collage">
           
            <img src="../assets/images/IMG-20240515-WA0000.jpg" alt="Image 1">
            <img src="../assets/images/IMG-20240515-WA0003.jpg" alt="Image 2">
            <img src="../assets/images/IMG-20240515-WA0005.jpg" alt="Image 3">
            <img src="../assets/images/IMG-20240515-WA0013.jpg" alt="Image 4">
        </div>
        <div class="centered-text">
            <h1>Your Centered Text</h1>
        </div>
    </div>


    <script src="../assets/js/script.js" type="module"></script>
    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.js"></script>
</body>

</html>
