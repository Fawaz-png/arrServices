<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Professional event security services ensuring safety and peace of mind for all your events." />
    <meta name="keywords"
        content="event security, security services, crowd management, VIP protection, risk assessment" />
    <meta name="author" content="Bello Fawaz - Arr Services Limited" />
    <title>Arr Services - Event Security Company</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <!-- intl-tel-input CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css" />
    <!-- intl-tel-input JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.css" />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="../assets/css/header.css" />
    <link rel="stylesheet" href="../assets/css/footer.css" />
    <link rel="stylesheet" href="../assets/css/contact.css" />
</head>

<body>
    <!-- Header will be dynamically loaded here -->
    <header></header>


    <main>
        <!-- Hero Section -->
        <section id="hero">
            <div class="hero-text">
                <h1>Contact Us</h1>
            </div>
        </section>

        <!-- Get in Touch Section -->
        <section id="contact-us">
            <div class="container">
                <div class="section-header">
                    <h2>Get in Touch</h2>
                    <p>We're here to assist you. Fill out the form below and we'll get back to you as soon as possible.
                    </p>
                </div>

                <div class="contact-content">
                    <!-- Form Container -->
                    <div class="form-container">
                        <form id="event-contact-form">
                            <div class="form-group">
                                <input type="text" id="name" name="from_name" placeholder="Your Name" required />
                            </div>
                            <div class="form-group">
                                <input type="email" id="email" name="from_email" placeholder="Your Email" required />
                            </div>
                            <div class="form-group">
                                <input type="tel" id="phone" name="phone_number" placeholder="Your Phone Number"
                                    required />
                            </div>
                            <div class="form-group">
                                <textarea id="message" name="message" rows="5" placeholder="Tell us about your event"
                                    required></textarea>
                            </div>
                            <button type="submit" class="cta contact-btn">Send</button>
                        </form>
                        <div id="form-message"></div>
                    </div>

                </div>
            </div>
        </section>

        <!-- Full Width Map Section -->
        <section>
            <div class="map-container">
                <!-- Mapbox map will be integrated here -->
                <div id="map"></div>
            </div>
        </section>

    </main>


    <!-- Footer will be dynamically loaded here -->
    <footer class="footer" id="footer"></footer>



    <script src="../assets/js/include.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.js"></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZmF3YXpiZWxsbyIsImEiOiJjbHhxcnV4djQwbXVtMmtxd2dlaDM1ZnMyIn0.aOIVUyZLSwLMNN0QRZCyuQ';
        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/streets-v11',
            center: [0.3074, 51.4487],
            zoom: 15
        });

        new mapboxgl.Marker()
            .setLngLat([0.3074, 51.4487])
            .addTo(map);
    </script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.12.0/mapbox-gl.js"></script>
    <script></script>
    <script src="../assets/js/script.js" type="module"></script>
</body>

</html>
