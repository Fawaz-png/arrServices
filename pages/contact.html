<body>
    <!-- Header will be dynamically loaded here -->
    <header></header>


    <main>
        <!-- Hero Section -->
        <section id="hero">
            <div class="hero-text">
                <h1>Contact Us</h1>
            </div>
        </section>

        <!-- Get in Touch Section -->
        <section id="contact-us">
            <div class="container">
                <div class="section-header">
                    <h2>Get in Touch</h2>
                    <p>We're here to assist you. Fill out the form below and we'll get back to you as soon as possible.
                    </p>
                </div>

                <div class="contact-content">
                    <!-- Form Container -->
                    <div class="form-container">
                        <form id="event-contact-form" action="send_mail.php" method="POST" novalidate>
                            <div class="form-group">
                                <label for="name">Your Name</label>
                                <input type="text" id="name" name="from_name" required />

                            </div>
                            <div class="form-group">
                                <label for="email">Your Email</label>
                                <input type="email" id="email" name="from_email" required />

                            </div>
                            <div class="form-group">
                                <label for="phone">Your Phone Number</label>
                                <input type="tel" id="phone" name="phone_number" required />
                                <span class="error-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="message">Tell us about your event</label>
                                <textarea id="message" name="message" rows="5" required></textarea>
                                <span class="error-message"></span>
                            </div>
                            <button type="submit" class="cta contact-btn">
                                <span>Send</span>
                                <span class="loading-spinner"></span>
                            </button>
                        </form>
                        <!-- Toast Message -->

                    </div>

                </div>
            </div>
        </section>

        var map = new mapboxgl.Map({

    <script></script>
    <script src="../assets/js/script.js" type="module"></script>
    <script>
        document.getElementById("event-contact-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const form = e.target;
            const formData = new FormData(form);
            const toast = document.getElementById("toast");

            // Clear error messages
            document.querySelectorAll(".error-message").forEach(el => el.textContent = "");

            // Basic real-time validation
            let isValid = true;
            form.querySelectorAll("input, textarea").forEach(field => {
                const errorMessage = field.parentElement.querySelector(".error-message");
                if (!field.checkValidity()) {
                    errorMessage.textContent = field.validationMessage || "This field is required.";
                    isValid = false;
                }
            });

            if (!isValid) return;

            // Show loading spinner
            form.querySelector(".loading-spinner").style.display = "inline-block";
            form.querySelector("button span:first-child").textContent = "Sending...";

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: formData,
                });

                const result = await response.json();

                if (result.success) {
                    showToast("Your message was sent successfully!", "success");
                    form.reset();
                } else {
                    showToast(result.message || "Failed to send your message.", "error");
                }
            } catch (error) {
                showToast("An error occurred. Please try again.", "error");
                console.error("Error:", error);
            } finally {
                // Hide loading spinner
                form.querySelector(".loading-spinner").style.display = "none";
                form.querySelector("button span:first-child").textContent = "Send";
            }
        });

        // Show toast message
        function showToast(message, type) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = `toast toast-${type}`;
            toast.style.opacity = 1;

            // Automatically hide toast after 4 seconds
            setTimeout(() => {
                toast.style.opacity = 0;
            }, 4000);
        }

    </script>
</body>

</html>
