<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Page Under Construction</title>
    <style>
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background-color: #fff;
            padding: 40px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }

        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-radius: 50%;
            border-top: 16px solid #007EA7;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .contact-info {
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<link rel="stylesheet" href="../assets/css/shared.css">

<body>
    <header></header>
    <div class="wrapper">
        <div class="container">
            <div class="loader"></div>
            <h1>Page Under Construction</h1>
            <p>We are working hard to bring you something awesome! Check back soon.</p>
            <p class="contact-info">For any inquiries, please contact us at: <br><a
                    href="mailto:support@example.com">support@example.com</a></p>
        </div>
    </div>

    <script src="../assets/js/include.js"></script>
</body>

</html>
