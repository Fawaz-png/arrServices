    <script>
        function toggleOpacity() {
            const toggleNav = document.querySelector('.toggle-nav');
            const currentOpacity = parseFloat(window.getComputedStyle(toggleNav).getPropertyValue('0pacity'));
            if (currentOpacity === 0) {
                toggleNav.style.opacity = 1; /* Set full opacity */
            } else{
                toggleNav.style.opacity= 0
            }
        }
