<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS for Carousel */
        .about-us {
            background-color: #222;
            color: #ddd;
            padding: 40px;
            box-sizing: border-box;
        }

        .about-us-container {
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .overview-text {
            max-width: 600px;
            text-align: left;
        }

        .overview-text h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .overview-text h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: normal;
            color: #ccc;
        }

        .overview-text p {
            font-size: 1em;
            line-height: 1.5;
        }

        /* Carousel Styling */
        .carousel-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            width: 100%;
            margin: 0 auto;
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
            flex: 1;
            width: 500px;
            /* Set consistent width and height to make it square */
            height: 500px;
        }

        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .carousel-slide {
            position: absolute;
            top: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
            opacity: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Ensure images cover the area without stretching */
        }

        .carousel-slide.active {
            transform: translateX(0);
            opacity: 1;
        }

        .carousel-arrow {
            font-size: 2em;
            cursor: pointer;
            color: #ddd;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-indicators {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .indicator {
            width: 10px;
            height: 10px;
            background-color: #aaa;
            border-radius: 50%;
            cursor: pointer;
        }

        .indicator.active {
            background-color: #ddd;
        }


        @media (max-width: 768px) {
            .about-us {
                padding: 10px;
            }

            .about-us-container {
                flex-direction: column;
                align-items: center;
            }

            .carousel {
                width: 100%;
                height: 100vw;
                /* Maintain a square shape based on viewport width */
            }

            .carousel-container {
                width: 100%;
                aspect-ratio: 1 / 1;
                height: 80vw;
                /* Maintain a square shape based on viewport width */
            }

            .overview-text {
                text-align: left;
                padding-top: 20px;
            }
        }

        @media (max-width: 480px) {
            .carousel {
                height: 100vw;
                /* Maintain a square shape based on viewport width */
            }

            .carousel-container {
                height: 80vw;
                aspect-ratio: 1 / 1;
                /* Maintain a square shape based on viewport width */
            }

            .carousel-arrow {
                padding: 5px;
            }
        }
    </style>
</head>

<body>


    <section class="about-us">
        <div class="about-us-container">
            <div class="carousel-wrapper">
                <div class="carousel-arrow left" id="left-arrow">&#9664;</div>
                <div class="carousel-container">
                    <div class="carousel">
                        <div class="carousel-slide active">
                            <img src="https://via.placeholder.com/500" alt="Slide 1">
                        </div>
                        <div class="carousel-slide">
                            <img src="https://via.placeholder.com/500" alt="Slide 2">
                        </div>
                        <div class="carousel-slide">
                            <img src="https://via.placeholder.com/500" alt="Slide 3">
                        </div>
                    </div>
                    <div class="carousel-indicators">
                        <span class="indicator active" data-slide="0"></span>
                        <span class="indicator" data-slide="1"></span>
                        <span class="indicator" data-slide="2"></span>
                    </div>
                </div>
                <div class="carousel-arrow right" id="right-arrow">&#9654;</div>
            </div>
            <div class="overview-text">
                <h2>Who We Are</h2>
                <h3>Trustworthy Protection for Every Event</h3>
                <p>We provide top-notch security services tailored to your needs, ensuring the safety and security of
                    your events with professionalism and care.</p>
            </div>
        </div>
    </section>




</body>

</html>
