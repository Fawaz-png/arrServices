<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .gallery-container {
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            width: 100vw;
        }

        .arrow {
            background: none;
            border: none;
            font-size: 2em;
            cursor: pointer;
            z-index: 10;
            padding: 0 10px;
        }

        .arrow.left {
            position: absolute;
            left: 0;
        }

        .arrow.right {
            position: absolute;
            right: 0;
        }

        .gallery {
            display: flex;
            overflow: hidden;
            /* hide scrollbar */
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }

        .gallery-item {
            min-width: 500px;
            max-width: 500px;
            height: 600px;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 10px;
        }

        .gallery-item img {
            width: 100%;
            height: auto;
        }

        .description {
            text-align: center;
            padding: 10px;
        }

        @media (max-width: 768px) {
            .gallery-item {
                min-width: 90vw;
                max-width: 90vw;
            }

            .arrow {
                display: none;
            }
        }

        /* Hide scrollbar */
        .gallery {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .gallery::-webkit-scrollbar {
            display: none;
            /* Chrome, Safari and Opera */
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <button class="arrow left">&#9664;</button>
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://via.placeholder.com/500x600" alt="Image 1">
                <div class="description">
                    <h2>Image 1 Title</h2>
                    <p>Description for image 1.</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/500x600" alt="Image 2">
                <div class="description">
                    <h2>Image 2 Title</h2>
                    <p>Description for image 2.</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/500x600" alt="Image 3">
                <div class="description">
                    <h2>Image 3 Title</h2>
                    <p>Description for image 3.</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/500x600" alt="Image 4">
                <div class="description">
                    <h2>Image 4 Title</h2>
                    <p>Description for image 4.</p>
                </div>
            </div>
            <div class="gallery-item">
                <img src="https://via.placeholder.com/500x600" alt="Image 5">
                <div class="description">
                    <h2>Image 5 Title</h2>
                    <p>Description for image 5.</p>
                </div>
            </div>
        </div>
        <button class="arrow right">&#9654;</button>
    </div>



    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gallery = document.querySelector('.gallery');

            // Arrow click handling
            document.body.addEventListener('click', (event) => {
                if (event.target.classList.contains('arrow')) {
                    if (event.target.classList.contains('left')) {
                        gallery.scrollBy({ left: -250, behavior: 'smooth' });
                    } else if (event.target.classList.contains('right')) {
                        gallery.scrollBy({ left: 250, behavior: 'smooth' });
                    }
                }
            });

            // Swiping and dragging
            let isDown = false;
            let startX;
            let scrollLeft;

            gallery.addEventListener('mousedown', (e) => {
                isDown = true;
                gallery.classList.add('active');
                startX = e.pageX - gallery.offsetLeft;
                scrollLeft = gallery.scrollLeft;
            });

            gallery.addEventListener('mouseleave', () => {
                isDown = false;
                gallery.classList.remove('active');
            });

            gallery.addEventListener('mouseup', () => {
                isDown = false;
                gallery.classList.remove('active');
            });

            gallery.addEventListener('mousemove', (e) => {
                if (!isDown) return;
                e.preventDefault();
                const x = e.pageX - gallery.offsetLeft;
                const walk = (x - startX) * 2; //scroll-fast
                gallery.scrollLeft = scrollLeft - walk;
            });

            gallery.addEventListener('touchstart', (e) => {
                isDown = true;
                startX = e.touches[0].pageX - gallery.offsetLeft;
                scrollLeft = gallery.scrollLeft;
            });

            gallery.addEventListener('touchend', () => {
                isDown = false;
            });

            gallery.addEventListener('touchmove', (e) => {
                if (!isDown) return;
                const x = e.touches[0].pageX - gallery.offsetLeft;
                const walk = (x - startX) * 2; //scroll-fast
                gallery.scrollLeft = scrollLeft - walk;
            });
        });



    </script>
</body>

</html>
