<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toggle Dropdown Navbar</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }

    .icon{
        color: black;
        width: fit-content;
        height: fit-content;
        border: 1px solid black;
    }

    .icon a{
        text-decoration: none;
        font-size: 22px;
        font-weight: bolder;
        border: 1px solid black;
    }

    .dp{
        border: 1px solid black;
        position: absolute;
        width: 10%;
        display: flex;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .dp a{
        font-size: 16px;
        font-weight: lighter;
        border: none;
    }

    .icon:hover .dp{
        opacity: 1;    
    }
</style>

<body>
    <div class="icon">
        <a href="">=</a>
        <div class="dp">
            <a href="">Link 1</a>
            <a href="">Link 2</a>
            <a href="">Link 3</a>
        </div>
    </div>
</body>

</html>
