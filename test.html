<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacking Dropdown Menu</title>
    <style>
        /* styles.css */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .dropdown {
            position: relative;
            display: inline-block;
            text-align: center;
        }

        #dropdown-btn,
        #dropdown-content a {
            display: block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            cursor: pointer;
            border-radius: 4px;
            width: 200px;
            /* Set a fixed width for consistency */
            box-sizing: border-box;
        }

        #dropdown-content {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            flex-direction: column;
            width: 100%;
            /* Ensure the content matches the trigger width */
        }

        #dropdown-content a {
            background: #007bff;
            border: none;
            opacity: 0;
            transition: transform 0.3s, opacity 0.3s;
            margin: 2px 0;
            /* Small margin between items for better visibility */
        }

        #dropdown-content.stacked a {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 1;
        }

        #dropdown-content.stacked a:nth-child(1) {
            z-index: 4;
        }

        #dropdown-content.stacked a:nth-child(2) {
            z-index: 3;
        }

        #dropdown-content.stacked a:nth-child(3) {
            z-index: 2;
        }

        #dropdown-content.stacked a:nth-child(4) {
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="dropdown">
        <a id="dropdown-btn" href="#">Dropdown Menu</a>
        <div id="dropdown-content">
            <a href="#">Menu Item 1</a>
            <a href="#">Menu Item 2</a>
            <a href="#">Menu Item 3</a>
            <a href="#">Menu Item 4</a>
        </div>
    </div>
    <script>
        // script.js
        // script.js
        document.addEventListener("DOMContentLoaded", () => {
            const dropDownBtn = document.getElementById('dropdown-btn');
            const dropDownContent = document.getElementById('dropdown-content');
            let isOpen = false;

            dropDownBtn.addEventListener('click', (event) => {
                event.preventDefault(); // Prevent default anchor behavior
                if (isOpen) {
                    // Animate back to stacked form and hide
                    const items = dropDownContent.querySelectorAll('a');
                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.style.transform = 'translateY(0)';
                            item.style.opacity = '0';
                        }, index * 100);
                    });
                    setTimeout(() => {
                        dropDownContent.style.display = 'none';
                    }, items.length * 100);
                } else {
                    // Show and animate to original position
                    dropDownContent.style.display = 'flex';
                    dropDownContent.classList.add('stacked');
                    const items = dropDownContent.querySelectorAll('a');
                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.style.transform = `translateY(${index * 40}px)`;
                            item.style.opacity = '1';
                        }, index * 100);
                    });
                }
                isOpen = !isOpen;
            });

            const menuItems = dropDownContent.querySelectorAll('a');
            menuItems.forEach(item => {
                item.addEventListener('click', (event) => {
                    event.preventDefault(); // Prevent default anchor behavior
                    dropDownBtn.textContent = item.textContent;
                    dropDownContent.querySelectorAll('a').forEach(anchor => {
                        anchor.style.transform = 'translateY(0)';
                        anchor.style.opacity = '0';
                    });
                    setTimeout(() => {
                        dropDownContent.style.display = 'none';
                    }, menuItems.length * 100);
                    isOpen = false;
                });
            });
        });

    </script>
</body>

</html>
