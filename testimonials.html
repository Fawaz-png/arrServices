<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seamless Image Slideshow</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        overflow: hidden;
        /* Prevents scrollbar appearance */
    }

    .slideshow-container {
        position: relative;
        max-width: 100%;
        height: 100vh;
        /* Full viewport height */
        margin: auto;
        overflow: hidden;
    }

    .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
    }

    .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Ensures the image covers the container */
        animation: zoom 18s infinite;
    }

    @keyframes zoom {
        0% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.1);
        }

        100% {
            transform: scale(1);
        }
    }

    .text {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: #f2f2f2;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        opacity: 0;
        animation: fadeInUp 1.5s forwards;
        animation-delay: 1s;
        /* Delays the text animation slightly */
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(50px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .active {
        opacity: 1;
        z-index: 1;
    }
</style>

<body>
    <div class="slideshow-container">
        <div class="slide active">
            <img src="images/freepik-export-20240615150546asuj.jpeg" class="zoom">
            <div class="text">Heading 1</div>
        </div>
        <div class="slide">
            <img src="images/pexels-trksami-20532119.jpg" class="zoom">
            <div class="text">Heading 2</div>
        </div>
        <div class="slide">
            <img src="images/hero-mobile.jpeg" class="zoom">
            <div class="text">Heading 3</div>
        </div>
    </div>
    <script>
        let slideIndex = 0;
        showSlides();

        function showSlides() {
            let slides = document.getElementsByClassName("slide");
            for (let i = 0; i < slides.length; i++) {
                slides[i].classList.remove("active");
            }
            slideIndex++;
            if (slideIndex > slides.length) { slideIndex = 1 }
            slides[slideIndex - 1].classList.add("active");
            setTimeout(showSlides, 3000); // Change image every 6 seconds
        }

    </script>
</body>

</html>
