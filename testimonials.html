<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Study/Portfolio Section</title>
    <link href='//fonts.googleapis.com/css?family=Roboto:100' rel='stylesheet' type='text/css'>
    <style>
        * {
            box-sizing: border-box;
            position: relative;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            font-size: 20vmin;
        }

        .collage--spotlight {
            height: 100vh;
            border-top: .125rem solid #fff;
            border-left: .125rem solid #fff;
            position: relative;
        }

        .spotlight__item {
            position: absolute;
            cursor: pointer;
            border-right: .125rem solid #fff;
            border-bottom: .125rem solid #fff;
            transition:
                top .5s,
                left .5s,
                z-index .5s,
                height .5s,
                width .5s,
                background .2s;
        }

        .spotlight__item.item--active {
            top: 0;
            left: 0;
            z-index: 20;
            height: 100%;
            width: 100%;
        }

        .spotlight__item:nth-of-type(1) {
            top: 0;
            left: 0;
            height: 66.66%;
            width: 33.33%;
            background: #317794;
        }

        .spotlight__item:nth-of-type(2) {
            top: 66.66%;
            left: 0;
            height: 33.33%;
            width: 33.33%;
            background: #5ec1c9;
        }

        .spotlight__item:nth-of-type(3) {
            top: 0;
            left: 33.33%;
            height: 33.33%;
            width: 66.66%;
            background: #db92ba;
        }

        .spotlight__item:nth-of-type(4) {
            top: 33.33%;
            left: 33.33%;
            height: 66.66%;
            width: 33.33%;
            background: #521b48;
        }

        .spotlight__item:nth-of-type(5) {
            top: 33.33%;
            left: 66.66%;
            height: 33.33%;
            width: 33.33%;
            background: #9e3550;
        }

        .spotlight__item:nth-of-type(6) {
            top: 66.66%;
            left: 66.66%;
            height: 33.33%;
            width: 33.33%;
            background: #8676d1;
        }

        .spotlight__item:before {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            transform: translate(0, -50%);
            color: #fff;
            content: attr(data-number);
        }
    </style>
</head>

<body>
    <section class="collage--spotlight">
        <div class="spotlight__item" data-number="1"></div>
        <div class="spotlight__item" data-number="2"></div>
        <div class="spotlight__item" data-number="3"></div>
        <div class="spotlight__item" data-number="4"></div>
        <div class="spotlight__item" data-number="5"></div>
        <div class="spotlight__item" data-number="6"></div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('.spotlight__item').click(function () {
            $(this).toggleClass('item--active');
        });
    </script>
</body>

</html>
