<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    #services {
        background-color: #f9f9f9;
        padding: 60px 20px;
        text-align: center;
    }

    #services .container {
        max-width: 1200px;
        margin: 0 auto;
    }

    #services h2 {
        font-size: 2.5em;
        color: #333;
        margin-bottom: 40px;
    }

    #services .services-grid {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 20px;
    }

    #services .service-block {
        position: relative;
        width: 30%;
        overflow: hidden;
        border-radius: 10px;
        transition: transform 0.3s;
    }

    #services .service-block img {
        width: 100%;
        height: auto;
        border-radius: 10px;
    }

    #services .service-block:hover {
        transform: scale(1.05);
    }

    #services .service-block .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        transition: opacity 0.3s;
    }

    #services .service-block:hover .overlay {
        opacity: 1;
    }

    #services .service-block h3 {
        color: #fff;
        font-size: 1.5em;
        font-weight: bold;
    }
</style>

<body>
    <section id="services">
        <div class="container">
          <h2>Our Services</h2>
          <div class="services-grid">
            <!-- Service Block 1 -->
            <div class="service-block">
              <img src="images/pexels-trksami-20532119.jpg" alt="Service 1">
              <div class="overlay">
                <h3>Service 1</h3>
              </div>
            </div>
            <!-- Service Block 2 -->
            <div class="service-block">
              <img src="images/pexels-trksami-20532119.jpg" alt="Service 2">
              <div class="overlay">
                <h3>Service 2</h3>
              </div>
            </div>
            <!-- Additional Service Blocks -->
            <div class="services-grid">
                <!-- Service Block 1 -->
                <div class="service-block">
                  <img src="images/pexels-trksami-20532119.jpg" alt="Service 1">
                  <div class="overlay">
                    <h3>Service 1</h3>
                  </div>
                </div>
                <!-- Service Block 2 -->
                <div class="service-block">
                  <img src="images/pexels-trksami-20532119.jpg" alt="Service 2">
                  <div class="overlay">
                    <h3>Service 2</h3>
                  </div>
                </div>
          </div>
        </div>
      </section>
      

</body>

</html>
