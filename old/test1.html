<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Header</title>
</head>
<style>
    html {
        box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
        border: 1px solid red;
    }

    :root {
        --DarkBlue: #1A3A5A;
        --Gray: #555555;
        --Yellow: #FFD700;
        --red: #C62828;
        --offWhite: #f5f5f5;
        --lightGrey: #cccccc;
    }

    body {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }



    /* Header styles */
    header {
        background-color: var(--DarkBlue);
        display: flex;
        justify-content: space-between;
    }

    #logo a {
        text-decoration: none;
        font-size: 20px;
    }





    .dropdown {
        position: relative;
        display: none;
        text-align: center;
    }

    #dropdown-btn,
    #dropdown-content a {
        display: block;
        background-color: var(--DarkBlue);
        color: white;
        text-decoration: none;
        cursor: pointer;
        border-radius: 4px;
        padding: 10px 15px;
        width: 100px;
        /* Set a fixed width for consistency */
        box-sizing: border-box;
    }

    #dropdown-content {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        flex-direction: column;
        width: 100%;
        /* Ensure the content matches the trigger width */
    }

    #dropdown-content a {
        background: var(--DarkBlue);
        border: none;
        opacity: 0;
        transition: transform 0.3s, opacity 0.3s;
        margin: 2px 0;
        /* Small margin between items for better visibility */
    }

    #dropdown-content.stacked a {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 1;
    }

    #dropdown-content.stacked a:nth-child(1) {
        z-index: 4;
    }

    #dropdown-content.stacked a:nth-child(2) {
        z-index: 3;
    }

    #dropdown-content.stacked a:nth-child(3) {
        z-index: 2;
    }

    #dropdown-content.stacked a:nth-child(4) {
        z-index: 1;
    }


    /* Media query for small screens */
    @media screen and (max-width: 768px) {
        header {
            height: 6vh;
            align-items: center;
        }

        .navbar {
            display: none;
        }

        .dropdown {
            display: block;
        }
    }


    .hero {
        background-image: url('images/portrait-male-security-guard-with-uniform.jpg');
        background-size: contain;
        background-repeat: no-repeat;
        height: 100vh;
        width: 100%;
        /* Full viewport height
        display: flex;
        justify-content: left;
        align-items: top;
        text-align: center; */
    }

    .hero .content>:first-child {
        color: var(--Yellow);
        font-size: 18px;
        font-weight: lighter;
        /* Slightly dark background for better text readability */
        border-radius: 8px;
    }

    .hero .content .tagline {
        font-size: 2em;
        margin-bottom: 20px;
        opacity: 0;
        animation: fadeIn 2s forwards;
        animation-delay: 0.5s;
        /* Adjust delay for animation timing */
    }

    .content,
    .action-button {
        padding: 10px 20px;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        display: inline-block;
        opacity: 0;
        animation: fadeIn 1.5s forwards;
        animation-delay: 1s;
        /* Adjust delay for animation timing */
    }

    /* Keyframes for fade-in animation */
    @keyframes fadeIn {
        to {
            opacity: 1;
        }
    }

    /* Responsive adjustments for small screens */
    @media (max-width: 600px) {
        .hero {
            background-size: cover;
            background-position: center;
            height: 50vh;
        }

        .hero .content .tagline {
            font-size: 1.5em;
        }

        .hero .content .action-button {
            padding: 8px 16px;
            font-size: 1em;
        }
    }
</style>

<body>
    <header>
        <div id="logo"><a href="#">Company Logo</a></div>
        <nav>
            <div class="navbar-container">
                <div class="navbar">
                    <div class="nav-links">
                        <a href="#">Home</a>
                        <a href="#">Services</a>
                        <a href="#">About Us</a>
                        <a href="#">Contact</a>
                    </div>
                </div>



                <div class="dropdown">
                    <a id="dropdown-btn" href="#">Home</a>
                    <div id="dropdown-content">
                        <a href="#">Home</a>
                        <a href="#">About</a>
                        <a href="#">Services</a>
                        <a href="#">Blog</a>
                        <a href="#">Contact</a>
                    </div>
                </div>

            </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="hero">
            <div class="content">
                <p>Arr Services</p>
                <p class="tag-line">Trustworthy protection for every event</p>
                <button class="action-button">Get Started</button>
            </div>
        </section>
    </main>

    <script>


        /* document.addEventListener("DOMContentLoaded", () => {
             const dropDownBtn = document.getElementById('dropdown-btn')
             const dropDownContent = document.getElementById('dropdown-content')
             document.addEventListener('click', (event) => {
                 if (event.target.matches('#dropdown-btn')) {
                     dropDownContent.style.display = dropDownContent.style.display === 'none' ? 'block' : 'none';
                 } else {
                     if (dropDownContent.style.display === 'block') {
                         dropDownContent.style.display = 'none';
                     }
                 }
             })
         })*/


        // script.js
        document.addEventListener("DOMContentLoaded", () => {
            const dropDownBtn = document.getElementById('dropdown-btn');
            const dropDownContent = document.getElementById('dropdown-content');
            let isOpen = false;

            dropDownBtn.addEventListener('click', (event) => {
                event.preventDefault(); // Prevent default anchor behavior
                if (isOpen) {
                    // Animate back to stacked form and hide
                    const items = dropDownContent.querySelectorAll('a');
                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.style.transform = 'translateY(0)';
                            item.style.opacity = '0';
                        }, index * 100);
                    });
                    setTimeout(() => {
                        dropDownContent.style.display = 'none';
                    }, items.length * 100);
                } else {
                    // Show and animate to original position
                    dropDownContent.style.display = 'flex';
                    dropDownContent.classList.add('stacked');
                    const items = dropDownContent.querySelectorAll('a');
                    items.forEach((item, index) => {
                        setTimeout(() => {
                            item.style.transform = `translateY(${index * 40}px)`;
                            item.style.opacity = '1';
                        }, index * 100);
                    });
                }
                isOpen = !isOpen;
            });

            const menuItems = dropDownContent.querySelectorAll('a');
            menuItems.forEach(item => {
                item.addEventListener('click', (event) => {
                    event.preventDefault(); // Prevent default anchor behavior
                    dropDownBtn.textContent = item.textContent;
                    dropDownContent.querySelectorAll('a').forEach(anchor => {
                        anchor.style.transform = 'translateY(0)';
                        anchor.style.opacity = '0';
                    });
                    setTimeout(() => {
                        dropDownContent.style.display = 'none';
                    }, menuItems.length * 100);
                    isOpen = false;
                });
            });
        });



    </script>
</body>

</html>
